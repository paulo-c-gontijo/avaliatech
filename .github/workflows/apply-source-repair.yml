name: Apply source repair
on:
  push:
    branches: [feature/flutter-avaliatech]
    paths:
      - tools/repair_manifest.json
  workflow_dispatch:
jobs:
  repair:
    if: github.ref == 'refs/heads/feature/flutter-avaliatech'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply verified source corrections
        run: python3 tools/apply_source_patch.py
      - name: Format and check source syntax
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair Flutter source syntax and format'
            git push origin HEAD:feature/flutter-avaliatech
          fi
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: avaliatech-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
