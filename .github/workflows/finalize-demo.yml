name: Validate and package demo
on:
  push:
    branches: [feature/flutter-avaliatech]
    paths:
      - .github/workflows/finalize-demo.yml
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Apply supported analyzer fixes
        run: dart fix --apply .
      - name: Format
        run: dart format lib test
      - name: Commit source and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test pubspec.lock analysis_options.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: clean analyzer diagnostics and lock dependencies'
            git push origin HEAD:feature/flutter-avaliatech
          fi
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: avaliatech-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
